apiVersion: v1
kind: ConfigMap
metadata:
  name: fabric-config
data:
  connection-org1.json: |
    {
      "name": "test-network-org1",
      "version": "1.0.0",
      "client": {
        "organization": "Org1",
        "connection": {
          "timeout": {
            "peer": {
              "endorser": "5000"
            }
          }
        }
      },
      "organizations": {
        "Org1": {
          "mspid": "Org1MSP",
          "peers": ["peer0.org1.example.com"],
          "certificateAuthorities": ["ca.org1.example.com"]
        }
      },
      "peers": {
        "peer0.org1.example.com": {
          "url": "grpcs://<EC2-DNS>:7051",
          "tlsCACerts": {
            "path": "/app/config/tls-cert.pem"
          },
          "grpcOptions": {
            "ssl-target-name-override": "peer0.org1.example.com",
            "hostnameOverride": "peer0.org1.example.com",
            "request-timeout": 5000
          }
        }
      },
      "orderers": {
        "orderer.example.com": {
          "url": "grpcs://<EC2-DNS>:7050",
          "grpcOptions": {
            "ssl-target-name-override": "orderer.example.com",
            "hostnameOverride": "orderer.example.com",
            "request-timeout": 5000
          },
          "tlsCACerts": {
            "path": "/app/config/orderer-tls-cert.pem"
          }
        }
      },
      "certificateAuthorities": {
        "ca.org1.example.com": {
          "url": "https://ca.org1.example.com:7054",
          "caName": "ca-org1",
          "tlsCACerts": {
            "pem": ["-----BEGIN CERTIFICATE-----..."]
          },
          "httpOptions": {
            "verify": false
          }
        }
      }
    }
